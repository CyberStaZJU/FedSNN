[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-fedsnn"
version = "0.1.0"
description = "Focused FedSNN strict packed-AsPy qualification snapshot"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.0",
  "torchvision>=0.15",
  "spikingjelly>=0.0.0.0.14",
  "h5py>=3.8",
]
test = ["pytest>=7"]
sfedhifi = ["tensorly>=0.8", "tensorboard>=2.10"]

[project.scripts]
fedsnn-train-topk = "fedsnn.train_topk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "npu: requires an available Ascend NPU and the qualified torch-npu/CANN environment",
]
